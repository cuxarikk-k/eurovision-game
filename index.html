<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eurovision Guessing Game</title>
<style>
  /* ---------- Colours and basic page setup ---------- */
  :root {
    --bg: #0b0620;
    --bg-2: #1a0f3d;
    --pink: #ff2e88;
    --purple: #8b5cf6;
    --cyan: #22d3ee;
    --yellow: #ffd60a;
    --green: #22c55e;
    --red: #ef4444;
    --gold: #ffc93c;
    --text: #ffffff;
    --muted: #c4b5fd;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,46,136,0.25), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(34,211,238,0.20), transparent 40%),
      linear-gradient(160deg, var(--bg), var(--bg-2));
    color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 1.2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-size: clamp(1.6rem, 3vw, 2.6rem);
    font-weight: 900;
    letter-spacing: 0.03em;
    background: linear-gradient(90deg, var(--pink), var(--yellow), var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .round-label {
    font-size: clamp(1.2rem, 2vw, 1.8rem);
    font-weight: 700;
    color: var(--muted);
  }

  main {
    width: 100%;
    max-width: 1100px;
    padding: 1rem 2rem 3rem;
    flex: 1;
  }

  /* Only one "screen" is visible at a time */
  .screen { display: none; flex-direction: column; align-items: center; gap: 1.5rem; text-align: center; }
  .screen.active { display: flex; }

  h1 { font-size: clamp(2.2rem, 5vw, 4rem); margin: 0.5rem 0 0; }
  h2 { font-size: clamp(1.8rem, 4vw, 3rem); margin: 0; }
  p.big { font-size: clamp(1.2rem, 2.2vw, 1.8rem); color: var(--muted); margin: 0; max-width: 800px; }

  /* ---------- Buttons ---------- */
  button {
    font-family: inherit;
    font-size: clamp(1.3rem, 2.4vw, 2rem);
    font-weight: 800;
    padding: 0.8em 1.6em;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    color: var(--bg);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-3px) scale(1.03); }
  button:active { transform: scale(0.97); }

  .btn-pink   { background: var(--pink);   color: #fff; box-shadow: 0 0 25px rgba(255,46,136,0.6); }
  .btn-cyan   { background: var(--cyan);   box-shadow: 0 0 25px rgba(34,211,238,0.5); }
  .btn-yellow { background: var(--yellow); box-shadow: 0 0 25px rgba(255,214,10,0.5); }
  .btn-green  { background: var(--green);  box-shadow: 0 0 25px rgba(34,197,94,0.5); }
  .btn-ghost  { background: transparent; color: var(--text); border: 3px solid var(--muted); }

  .button-row { display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: center; }

  /* ---------- Difficulty choice ---------- */
  .difficulty-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.5rem;
    width: 100%;
  }
  .difficulty-grid button {
    border-radius: 28px;
    padding: 1.4em 1em;
    display: flex;
    flex-direction: column;
    gap: 0.4em;
  }
  .difficulty-grid small { font-size: 0.6em; font-weight: 600; opacity: 0.85; }

  /* ---------- Round screen ---------- */
  .round-top {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .badge {
    font-size: clamp(1.2rem, 2.2vw, 1.8rem);
    font-weight: 800;
    padding: 0.4em 1em;
    border-radius: 999px;
    background: var(--purple);
  }

  .timer {
    --p: 100; /* percent of time left, updated by JavaScript */
    width: clamp(110px, 14vw, 160px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: conic-gradient(var(--cyan) calc(var(--p) * 1%), rgba(255,255,255,0.12) 0);
    display: grid;
    place-items: center;
  }
  .timer span {
    width: 78%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--bg);
    display: grid;
    place-items: center;
    font-size: clamp(2.6rem, 5vw, 4rem);
    font-weight: 900;
  }
  .timer.danger { background: conic-gradient(var(--red) calc(var(--p) * 1%), rgba(255,255,255,0.12) 0); animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }

  /* ---------- Hints: visible to players while they guess ---------- */
  .hints {
    width: min(100%, 820px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
  }
  /* The emoji picture puzzle: the main clue */
  .hint-emoji {
    font-size: clamp(4rem, 11vw, 8rem);
    line-height: 1.1;
    letter-spacing: 0.1em;
    padding: 0.15em 0.6em;
    border-radius: 32px;
    background: rgba(255,255,255,0.08);
    border: 4px solid var(--cyan);
    box-shadow: 0 0 40px rgba(34,211,238,0.35);
  }
  .hint-chips { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; }
  .hint-chip {
    font-size: clamp(1.4rem, 3vw, 2.4rem);
    font-weight: 800;
    padding: 0.35em 0.9em;
    border-radius: 999px;
    background: rgba(255,255,255,0.1);
    border: 3px solid var(--cyan);
  }
  .hint-chip:nth-child(2) { border-color: var(--yellow); }
  .hint-chip:nth-child(3) { border-color: var(--pink); }
  .hint-blanks {
    font-family: "Courier New", monospace;
    font-size: clamp(1.6rem, 3.6vw, 2.8rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    white-space: pre-wrap;
    color: var(--yellow);
  }

  /* The Eurovision-themed card */
  .card {
    position: relative;
    width: min(100%, 820px);
    aspect-ratio: 16 / 9;
    border-radius: 32px;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 25%, rgba(255,214,10,0.35), transparent 35%),
      radial-gradient(circle at 80% 70%, rgba(34,211,238,0.45), transparent 40%),
      linear-gradient(135deg, var(--pink), var(--purple) 55%, #2563eb);
    box-shadow: 0 0 60px rgba(139,92,246,0.6);
    display: grid;
    place-items: center;
  }

  /* Decorative heart and stars in the card background */
  .card .heart {
    position: absolute;
    font-size: min(40vw, 380px);
    line-height: 1;
    color: rgba(255,255,255,0.12);
    user-select: none;
  }
  .card .stars {
    position: absolute;
    inset: 0;
    font-size: 2rem;
    color: rgba(255,255,255,0.7);
    pointer-events: none;
  }
  .card .stars span { position: absolute; }

  /* The answer (hidden behind the stickers until reveal) */
  .clue {
    position: relative;
    z-index: 1;
    padding: 1rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    text-shadow: 0 3px 12px rgba(0,0,0,0.45);
  }
  .clue .title   { font-size: clamp(2.2rem, 5.5vw, 4.4rem); font-weight: 900; line-height: 1.1; }
  .clue .artist  { font-size: clamp(1.5rem, 3.2vw, 2.4rem); font-weight: 700; }
  .clue .details { font-size: clamp(1.4rem, 3vw, 2.2rem);  font-weight: 700; color: var(--yellow); }

  /* The stickers that cover the answer */
  .stickers {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .sticker {
    position: absolute;
    display: grid;
    place-items: center;
    border: 6px solid #fff;               /* white edge, like a real die-cut sticker */
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    font-weight: 900;
    color: #fff;
    transform: rotate(var(--r));
    transition: transform 0.7s cubic-bezier(.6,-0.3,.7,1), opacity 0.7s;
    transition-delay: var(--delay);
  }
  .sticker.round { border-radius: 50%; aspect-ratio: 1; }

  /* The big striped sticker underneath: this one does the actual hiding */
  .sticker.base {
    inset: 18% 12%;
    border-radius: 28px;
    background: repeating-linear-gradient(45deg, var(--yellow) 0 30px, #ffbe0b 30px 60px);
  }

  /* When peeled, every sticker flies off in its own direction */
  .stickers.peeled .sticker {
    transform: translate(var(--fx), var(--fy)) rotate(calc(var(--r) + 45deg));
    opacity: 0;
  }

  /* Used to put stickers back instantly at the start of a round */
  .stickers.instant .sticker { transition: none; }

  /* After-reveal panel */
  .result {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    width: 100%;
  }
  .result.show { display: flex; }
  .points-message { font-size: clamp(1.8rem, 3.6vw, 2.8rem); font-weight: 900; color: var(--yellow); }

  input[type="text"] {
    font-family: inherit;
    font-size: clamp(1.4rem, 2.6vw, 2rem);
    padding: 0.6em 1em;
    border-radius: 999px;
    border: 3px solid var(--cyan);
    background: rgba(255,255,255,0.08);
    color: var(--text);
    width: min(100%, 520px);
    text-align: center;
    outline: none;
  }
  input[type="text"]:focus { box-shadow: 0 0 20px rgba(34,211,238,0.6); }
  input.shake { animation: shake 0.4s; border-color: var(--red); }
  @keyframes shake {
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* ---------- Leaderboard ---------- */
  .leaderboard {
    list-style: none;
    padding: 0;
    margin: 0;
    width: min(100%, 760px);
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }
  .leaderboard li {
    display: grid;
    grid-template-columns: 4rem 1fr auto;
    align-items: center;
    gap: 1rem;
    padding: 0.8rem 1.6rem;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    border-left: 8px solid var(--pink);
    font-size: clamp(1.4rem, 2.8vw, 2.2rem);
    font-weight: 700;
    text-align: left;
  }
  .leaderboard li:nth-child(3n+2) { border-left-color: var(--cyan); }
  .leaderboard li:nth-child(3n)   { border-left-color: var(--yellow); }
  .leaderboard .rank   { color: var(--muted); }
  .leaderboard .points { font-weight: 900; }

  .leaderboard li.winner {
    background: linear-gradient(90deg, var(--gold), #ffe58a);
    color: var(--bg);
    border-left-color: #fff;
    box-shadow: 0 0 40px rgba(255,201,60,0.7);
    transform: scale(1.04);
  }
  .leaderboard li.winner .rank { color: var(--bg); }

  .empty-board { font-size: clamp(1.3rem, 2.4vw, 1.8rem); color: var(--muted); }

  .winner-banner {
    font-size: clamp(2.4rem, 6vw, 4.6rem);
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(255,201,60,0.8);
  }
</style>
</head>
<body>

<header>
  <div class="logo">♥ Eurovision Guess</div>
  <div class="round-label" id="roundLabel"></div>
</header>

<main>

  <!-- SCREEN 1: host picks the difficulty for the next round -->
  <section class="screen active" id="screenDifficulty">
    <h1>Choose the difficulty</h1>
    <p class="big">Players see an emoji picture puzzle and shout out the song title hidden under the stickers.</p>
    <div class="difficulty-grid">
      <button class="btn-cyan"   data-difficulty="easy">Easy<small>Big hits only · emojis + year + letter blanks</small></button>
      <button class="btn-yellow" data-difficulty="medium">Medium<small>Emojis + year</small></button>
      <button class="btn-pink"   data-difficulty="hard">Hard<small>Emojis only</small></button>
    </div>
  </section>

  <!-- SCREEN 2: the round itself -->
  <section class="screen" id="screenRound">
    <div class="round-top">
      <div class="badge" id="difficultyBadge">Easy</div>
      <div class="timer" id="timer"><span id="timerNumber">30</span></div>
    </div>

    <!-- Hints players can see while guessing -->
    <div class="hints">
      <div class="hint-emoji" id="hintEmoji"></div>
      <div class="hint-chips" id="hintChips"></div>
      <div class="hint-blanks" id="hintBlanks"></div>
    </div>

    <div class="card">
      <div class="heart">♥</div>
      <div class="stars">
        <span style="top:8%;left:6%">★</span>
        <span style="top:14%;right:8%">✦</span>
        <span style="bottom:10%;left:12%">✦</span>
        <span style="bottom:8%;right:6%">★</span>
        <span style="top:45%;left:3%">✧</span>
        <span style="top:50%;right:3%">✧</span>
      </div>
      <div class="clue" id="clue"></div>
      <div class="stickers" id="stickers">
        <div class="sticker base"
             style="--r:-3deg; --fx:0%; --fy:160%; --delay:0.45s;"></div>
        <div class="sticker round"
             style="top:8%; left:6%; width:22%; background:var(--pink); font-size:clamp(2.5rem,6vw,4.5rem);
                    --r:-12deg; --fx:-160%; --fy:-160%; --delay:0s;">🎤</div>
        <div class="sticker round"
             style="top:10%; right:9%; width:19%; background:var(--cyan); font-size:clamp(3rem,7vw,5rem);
                    --r:10deg; --fx:170%; --fy:-160%; --delay:0.08s;">♥</div>
        <div class="sticker"
             style="bottom:12%; left:10%; padding:0.3em 0.9em; border-radius:999px; background:var(--purple);
                    font-size:clamp(1.3rem,3vw,2.2rem); --r:-6deg; --fx:-150%; --fy:200%; --delay:0.16s;">Douze points!</div>
        <div class="sticker round"
             style="bottom:9%; right:10%; width:20%; background:var(--green); font-size:clamp(2.5rem,6vw,4.5rem);
                    --r:14deg; --fx:170%; --fy:170%; --delay:0.24s;">🎶</div>
        <div class="sticker round"
             style="top:33%; left:39%; width:22%; background:var(--red); font-size:clamp(3.5rem,8vw,6rem);
                    --r:8deg; --fx:0%; --fy:-260%; --delay:0.32s;">★</div>
      </div>
    </div>

    <button class="btn-pink" id="revealButton">Reveal!</button>

    <div class="result" id="result">
      <div class="points-message" id="pointsMessage"></div>
      <div id="awardArea" class="result show">
        <input type="text" id="playerName" placeholder="Who guessed it?" list="knownPlayers" autocomplete="off">
        <datalist id="knownPlayers"></datalist>
        <div class="button-row">
          <button class="btn-green" id="awardButton">Award points</button>
          <button class="btn-ghost" id="skipButton">Nobody got it</button>
        </div>
      </div>
      <button class="btn-cyan" id="continueButton">See leaderboard</button>
    </div>
  </section>

  <!-- SCREEN 3: leaderboard between rounds -->
  <section class="screen" id="screenBoard">
    <h1>Leaderboard</h1>
    <ul class="leaderboard" id="boardList"></ul>
    <div class="button-row">
      <button class="btn-pink" id="nextRoundButton">Next round</button>
      <button class="btn-ghost" id="finishButton">Finish game</button>
    </div>
  </section>

  <!-- SCREEN 4: final results -->
  <section class="screen" id="screenFinal">
    <h1>Final results</h1>
    <div class="winner-banner" id="winnerBanner"></div>
    <ul class="leaderboard" id="finalList"></ul>
    <button class="btn-yellow" id="newGameButton">New game</button>
  </section>

</main>

  const ROUND_SECONDS = 30;

  const DIFFICULTY_LABELS = { easy: "Easy", medium: "Medium", hard: "Hard" };

  // ---------- Everything the game needs to remember ----------
  const state = {
    scores: {},        // e.g. { "anna": { name: "Anna", points: 45 } }
    round: 0,
    played: new Set(), // songs already used this game, so they don't repeat
    song: null,        // the song in the current round
    difficulty: "easy",
    timerId: null,
    startTime: 0,
    secondsLeft: ROUND_SECONDS,
    roundOver: false,
    pointsOnOffer: 0
  };

  // ---------- Small helpers ----------
  const $ = (id) => document.getElementById(id);

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    $(id).classList.add("active");
  }

  // Easy mode only uses songs marked "popular: true"; Medium and Hard use every song
  function nextSong(difficulty) {
    const pool = difficulty === "easy" ? SONGS.filter((s) => s.popular) : SONGS;
    let available = pool.filter((s) => !state.played.has(s));

    // Every song in this pool has been used: allow them all again
    if (available.length === 0) {
      pool.forEach((s) => state.played.delete(s));
      available = pool;
    }

    const song = available[Math.floor(Math.random() * available.length)];
    state.played.add(song);
    return song;
  }

  function updateRoundLabel() {
    $("roundLabel").textContent = state.round > 0 ? "Round " + state.round : "";
  }

  // ---------- Hints shown while players guess ----------
  function showHints() {
    const song = state.song;
    const chips = $("hintChips");
    chips.innerHTML = "";

    // The picture puzzle is always shown
    $("hintEmoji").textContent = song.emoji;

    // Easy and Medium also get the year
    if (state.difficulty !== "hard") addChip(chips, "📅 " + song.year);

    // Easy only: the title as blanks, with just its first letter showing
    $("hintBlanks").textContent = state.difficulty === "easy" ? titleAsBlanks(song.title) : "";
  }

  function addChip(parent, text) {
    const chip = document.createElement("div");
    chip.className = "hint-chip";
    chip.textContent = text;
    parent.appendChild(chip);
  }

  // "Euphoria" becomes "E_______"; spaces and punctuation stay so players see the word shapes
  function titleAsBlanks(title) {
    let firstShown = false;
    return title.replace(/[\p{L}\p{N}]/gu, (ch) => {
      if (!firstShown) { firstShown = true; return ch; }
      return "_";
    }).replace(/ /g, "   ");
  }

  // ---------- Starting a round ----------
  function startRound(difficulty) {
    state.difficulty = difficulty;
    state.song = nextSong(difficulty);
    state.round += 1;
    state.roundOver = false;
    state.secondsLeft = ROUND_SECONDS;
    updateRoundLabel();

    $("difficultyBadge").textContent = DIFFICULTY_LABELS[difficulty];
    $("clue").innerHTML = "";                 // nothing behind the stickers yet
    showHints();

    // Put all stickers back on instantly (no fly-in animation)
    const stickers = $("stickers");
    stickers.classList.add("instant");
    stickers.classList.remove("peeled");
    void stickers.offsetWidth;                // makes the browser apply the change right now
    stickers.classList.remove("instant");

    $("revealButton").style.display = "";
    $("result").classList.remove("show");
    $("playerName").value = "";

    showScreen("screenRound");
    drawTimer(ROUND_SECONDS);

    state.startTime = performance.now();
    state.timerId = setInterval(tick, 100);
  }

  // ---------- The countdown ----------
  function tick() {
    const elapsed = (performance.now() - state.startTime) / 1000;
    const remaining = Math.max(0, ROUND_SECONDS - elapsed);
    state.secondsLeft = Math.ceil(remaining);
    drawTimer(remaining);
    if (remaining <= 0) endRound(true);
  }

  function drawTimer(remaining) {
    const timer = $("timer");
    $("timerNumber").textContent = Math.ceil(remaining);
    timer.style.setProperty("--p", (remaining / ROUND_SECONDS) * 100);
    timer.classList.toggle("danger", remaining <= 5 && remaining > 0);
  }

  // ---------- Ending a round (Reveal pressed, or time ran out) ----------
  function endRound(timedOut) {
    if (state.roundOver) return;
    state.roundOver = true;
    clearInterval(state.timerId);

    // Points = the number showing on the clock when Reveal was pressed
    state.pointsOnOffer = timedOut ? 0 : state.secondsLeft;
    if (timedOut) drawTimer(0);

    showAnswer();
    $("stickers").classList.add("peeled");
    $("revealButton").style.display = "none";

    if (state.pointsOnOffer > 0) {
      $("pointsMessage").textContent = state.pointsOnOffer + " points up for grabs!";
      $("awardArea").style.display = "";
      $("continueButton").style.display = "none";
      refreshPlayerSuggestions();
      setTimeout(() => $("playerName").focus(), 300);
    } else {
      $("pointsMessage").textContent = "Time's up! No points this round.";
      $("awardArea").style.display = "none";
      $("continueButton").style.display = "";
    }
    $("result").classList.add("show");
  }

  // The full answer that appears when the stickers come off
  function showAnswer() {
    const clue = $("clue");
    clue.innerHTML = "";
    addClueLine(clue, "title", state.song.title);
    addClueLine(clue, "artist", state.song.artist);
    addClueLine(clue, "details", state.song.country + " · " + state.song.year);
  }

  function addClueLine(parent, className, text) {
    const line = document.createElement("div");
    line.className = className;
    line.textContent = text;
    parent.appendChild(line);
  }

  // ---------- Giving points ----------
  function awardPoints() {
    const input = $("playerName");
    const name = input.value.trim();
    if (!name) {
      input.classList.remove("shake");
      void input.offsetWidth;          // restarts the shake animation
      input.classList.add("shake");
      input.focus();
      return;
    }
    const key = name.toLowerCase();    // "anna" and "Anna" count as the same player
    if (!state.scores[key]) state.scores[key] = { name: name, points: 0 };
    state.scores[key].points += state.pointsOnOffer;
    showLeaderboard();
  }

  function refreshPlayerSuggestions() {
    const list = $("knownPlayers");
    list.innerHTML = "";
    Object.values(state.scores).forEach((p) => {
      const option = document.createElement("option");
      option.value = p.name;
      list.appendChild(option);
    });
  }

  // ---------- Leaderboards ----------
  function sortedPlayers() {
    return Object.values(state.scores).sort(
      (a, b) => b.points - a.points || a.name.localeCompare(b.name)
    );
  }

  function fillLeaderboard(listElement, highlightWinners) {
    listElement.innerHTML = "";
    const players = sortedPlayers();

    if (players.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty-board";
      empty.style.display = "block";
      empty.style.textAlign = "center";
      empty.textContent = "No points scored yet.";
      listElement.appendChild(empty);
      return [];
    }

    const topScore = players[0].points;
    players.forEach((p, index) => {
      const row = document.createElement("li");
      if (highlightWinners && topScore > 0 && p.points === topScore) row.classList.add("winner");

      const rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = "#" + (index + 1);

      const name = document.createElement("span");
      name.textContent = p.name;

      const pts = document.createElement("span");
      pts.className = "points";
      pts.textContent = p.points + " pts";

      row.append(rank, name, pts);
      listElement.appendChild(row);
    });

    return players.filter((p) => topScore > 0 && p.points === topScore);
  }

  function showLeaderboard() {
    fillLeaderboard($("boardList"), false);
    showScreen("screenBoard");
  }

  function showFinal() {
    const winners = fillLeaderboard($("finalList"), true);
    let banner = "No winner this time!";
    if (winners.length === 1) banner = "🏆 " + winners[0].name + " wins! 🏆";
    if (winners.length > 1) banner = "🏆 It's a tie: " + winners.map((w) => w.name).join(" & ") + "! 🏆";
    $("winnerBanner").textContent = banner;
    showScreen("screenFinal");
  }

  function newGame() {
    state.scores = {};
    state.round = 0;
    state.played = new Set();
    updateRoundLabel();
    showScreen("screenDifficulty");
  }

  // ---------- Connecting buttons to actions ----------
  document.querySelectorAll("[data-difficulty]").forEach((btn) => {
    btn.addEventListener("click", () => startRound(btn.dataset.difficulty));
  });
  $("revealButton").addEventListener("click", () => endRound(false));
  $("awardButton").addEventListener("click", awardPoints);
  $("playerName").addEventListener("keydown", (e) => { if (e.key === "Enter") awardPoints(); });
  $("skipButton").addEventListener("click", showLeaderboard);
  $("continueButton").addEventListener("click", showLeaderboard);
  $("nextRoundButton").addEventListener("click", () => showScreen("screenDifficulty"));
  $("finishButton").addEventListener("click", showFinal);
  $("newGameButton").addEventListener("click", newGame);
</script>
